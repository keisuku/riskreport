<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リスクレポート基盤 ─ 診断・Excel様式・レポート</title>
<meta name="description" content="企業向けリスクエンジニアリング・レポートを作る基盤。1つのデータから簡易版と網羅版を出力します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* デザイン方針「検図」：図面を検査するときの、墨の線と朱の書き込み。
   色は2系統だけ ── 損害の大きさ（--m1〜5、朱の濃淡）と、領域（--d-*、7色）。装飾のための色は使わない。
   書体は3つ ── 見出し＝明朝、本文＝ゴシック、数字＝等幅数字の欧文。角は丸めず、面ではなく罫線で区切る。 */
:root{
  --paper:#faf8f3;--panel:#fffefb;--ink:#1b1f24;--ink2:#4a4f57;--ink3:#7b8088;--rule:#d5d0c3;--rule2:#e9e5da;--wash:#f1eee5;
  --m1:#f3dcc8;--m2:#e9b08a;--m3:#d97a50;--m4:#b83a26;--m5:#7d1a13;--shu:#b83a26;
  --d-prop:#2a78d6;--d-bi:#c98500;--d-cyber:#6250d6;--d-liab:#1baf7a;--d-people:#e87ba4;--d-fin:#8a5a2b;--d-ovs:#008300;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-head:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-num:"IBM Plex Sans","Helvetica Neue",Arial,"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181b;--panel:#1c1f23;--ink:#ecebe6;--ink2:#bdbbb3;--ink3:#8d8c86;--rule:#3a3d42;--rule2:#282b30;--wash:#1f2226;
  --m1:#4a2a20;--m2:#7a3223;--m3:#a8452c;--m4:#d4694a;--m5:#f0a585;--shu:#e07a5c;
  --d-prop:#3987e5;--d-bi:#c98500;--d-cyber:#9085e9;--d-liab:#199e70;--d-people:#d55181;--d-fin:#a8743f;--d-ovs:#0ca30c;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181b;--panel:#1c1f23;--ink:#ecebe6;--ink2:#bdbbb3;--ink3:#8d8c86;--rule:#3a3d42;--rule2:#282b30;--wash:#1f2226;
  --m1:#4a2a20;--m2:#7a3223;--m3:#a8452c;--m4:#d4694a;--m5:#f0a585;--shu:#e07a5c;
  --d-prop:#3987e5;--d-bi:#c98500;--d-cyber:#9085e9;--d-liab:#199e70;--d-people:#d55181;--d-fin:#a8743f;--d-ovs:#0ca30c;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;font-feature-settings:"palt";overflow-x:hidden}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0 0 .6em}a{color:inherit}
.num,.numf,.t-num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--rule);border-radius:0;padding:.35em .5em;min-width:0;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
textarea{width:100%;line-height:1.6;resize:vertical}
.numf{text-align:right}
.fine{font-size:12px;color:var(--ink3);line-height:1.6}.fine.warn{color:var(--ink2)}
.help{font-size:12px;color:var(--ink3);margin:.2em 0 0;line-height:1.5}
.u{font-size:11px;color:var(--ink3);margin-left:.4em;font-weight:400}
.unc{display:inline-block;font-size:.82em;line-height:1.3;padding:0 .4em;border:1px solid var(--shu);color:var(--shu);white-space:nowrap;font-weight:500}
.req{color:var(--shu);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--ink);background:transparent;padding:.5em 1em;cursor:pointer;text-decoration:none;font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--wash)}.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{opacity:.86;background:var(--ink)}
.btn.sm{padding:.3em .7em;font-size:13px}.btn.ghost{border-color:var(--rule);color:var(--ink2)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6em;align-items:center;margin:.8em 0}.row.between{justify-content:space-between}
.chk{display:inline-flex;gap:.4em;align-items:center;font-size:13px}.chk input{width:auto}
.dom{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em;vertical-align:.02em}
.gr{display:inline-block;min-width:1.6em;text-align:center;font-family:var(--f-num);font-weight:600;color:#1b1f24;padding:0 .2em}
.pl{display:inline-block;min-width:1.5em;text-align:center;font-family:var(--f-num);font-weight:600;border:1px solid var(--ink);line-height:1.35}
.pl1{background:var(--m4);color:#fff;border-color:var(--m4)}.pl2{background:var(--m2);color:#1b1f24;border-color:var(--m2)}.pl3{background:transparent}.pl4{background:var(--ink);color:var(--paper)}
.tag{font-size:10px;border:1px solid var(--rule);padding:0 .3em;margin-left:.4em;color:var(--ink3)}

/* 上部 */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;gap:1.2em;padding:0 20px;min-height:48px}
.brand{display:flex;align-items:center;gap:.6em;font-family:var(--f-head);font-weight:700;white-space:nowrap;text-decoration:none}
.brand i{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1.5px solid var(--shu);color:var(--shu);font-style:normal;font-size:13px;border-radius:50%}
#nav{display:flex;overflow-x:auto;scrollbar-width:none;flex:1}#nav::-webkit-scrollbar{display:none}
#nav a{display:flex;align-items:center;padding:0 .9em;text-decoration:none;font-size:14px;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent}
#nav a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
#casename{display:flex;align-items:center;font-size:12px;color:var(--ink3);white-space:nowrap;max-width:26ch;overflow:hidden;text-overflow:ellipsis}
main{max-width:1440px;margin:0 auto;padding:0 20px 80px}
.view{display:none}.view.on{display:block}
.pagehead{display:flex;flex-wrap:wrap;gap:1em 2em;justify-content:space-between;align-items:flex-end;padding:28px 0 16px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.pagehead h1{font-size:28px}.pagehead p{max-width:70ch;color:var(--ink2);margin:.4em 0 0;font-size:14px}
.notice{border:1px solid var(--rule);padding:.6em .9em;font-size:13px;display:flex;gap:.8em;align-items:center;flex-wrap:wrap}.notice.bad,.warnbox{border-color:var(--shu)}
.warnbox{display:block;margin-bottom:1em}
.panel{border-top:2px solid var(--ink);padding:14px 0 26px;margin-top:10px}.panel>h2{font-size:18px;margin-bottom:.6em}.panel h3{font-size:15px;margin:1em 0 .4em}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.frm{display:flex;flex-wrap:wrap;gap:.6em 1.4em;align-items:center;font-size:13px}.frm label{display:inline-flex;gap:.5em;align-items:center}.frm input.short{width:9em}

/* 冒頭 */
.hero{display:grid;grid-template-columns:minmax(300px,31%) 1fr;gap:0 36px;min-height:calc(100vh - 49px);padding:28px 0 20px;align-items:start}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--ink2);border-left:3px solid var(--shu);padding-left:.7em;margin-bottom:1.1em}
.hl-main{font-size:clamp(22px,2.15vw,33px);line-height:1.55;font-weight:700;letter-spacing:.01em}
.hl-sub{color:var(--ink2);margin:1.1em 0 0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:1.5em 0 0;border-top:1px solid var(--ink)}
.kpi{padding:.7em .8em .8em 0;border-bottom:1px solid var(--rule)}.kpi:nth-child(odd){border-right:1px solid var(--rule)}.kpi:nth-child(even){padding-left:.9em}
.k-l{font-size:11.5px;color:var(--ink2)}.k-v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.01em}.k-v small{font-size:.45em;font-weight:500;margin-left:.15em;font-family:var(--f-body)}
.k-s{font-size:11.5px;color:var(--ink3);line-height:1.4}
.cta{display:flex;flex-wrap:wrap;gap:.6em;margin:1.6em 0 .8em}
.fighead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:.6em 1.5em;margin-bottom:.6em}
.fighead h2{font-size:19px}.fighead p{margin:.15em 0 0;font-size:13px;color:var(--ink2)}
.figbox{min-height:60px}.viz-wrap{overflow:hidden}
.figsec{border-top:2px solid var(--ink);padding:16px 0 30px}
.seg{display:inline-flex;border:1px solid var(--ink);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.35em .8em;cursor:pointer;font-size:13px;border-right:1px solid var(--rule)}.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
.filterbar{position:sticky;top:49px;z-index:10;background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:.5em 1.2em;align-items:center;padding:.5em 0;font-size:13px;margin-bottom:6px}
.fb-l{font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:.3em}
.chip{border:1px solid var(--rule);background:transparent;padding:.15em .7em;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center}.chip i{width:.65em;height:.65em;border-radius:50%;margin-right:.4em}.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.filterbar select{padding:.15em .4em}

/* 図 */
svg.viz{display:block;max-width:100%;height:auto;font-family:var(--f-body);overflow:visible}
.viz text{fill:var(--ink)}
.viz .t-name{font-weight:600}.viz .t-num{fill:var(--ink2);font-family:var(--f-num);font-variant-numeric:tabular-nums}.viz .t-num.sm{font-size:11px}.viz .t-num .b{font-weight:600;fill:var(--ink)}.viz .t-num .hot{fill:var(--ink);font-weight:700}
.viz .t-mark{fill:var(--shu)}.viz .t-axis{font-size:10.5px;fill:var(--ink3);font-family:var(--f-num)}.viz .t-axis.sub{font-size:9px;font-family:var(--f-body)}.viz .t-axis.ttl{font-size:10.5px;fill:var(--ink2);font-family:var(--f-body)}
.viz .t-cap{font-size:10px;fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.viz .t-zone{font-size:11px;fill:var(--shu);font-weight:700}
.viz .grid{stroke:var(--rule);stroke-width:1}.viz .grid.faint{stroke:var(--rule2)}.viz .rule{stroke:var(--ink);stroke-width:1}
.viz .cell-wash{opacity:.17}.viz .cell-wash.g1{opacity:.07}.viz .cell-wash.g2{opacity:.16}.viz .cell-wash.g3{opacity:.2}.viz .cell-wash.g4{opacity:.2}.viz .cell-wash.g5{opacity:.2}
.viz .cap{stroke:var(--ink);stroke-width:1}.viz .cap.ret{stroke-dasharray:5 3}.viz .cap.net{stroke-width:1.5}
.viz .leader{fill:none;stroke:var(--ink3);stroke-width:.75}
.viz .dot{stroke:var(--paper);stroke-width:2;fill-opacity:.9}.viz .dot.site{stroke:var(--ink);stroke-width:1;fill-opacity:1}
.viz g.pt{transform-box:fill-box;transform-origin:center;cursor:pointer}
.viz .ghost{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 2}
.viz .move{stroke:var(--ink3);stroke-width:.8}.viz .arr-head{fill:var(--ink3)}
.viz .hatch-l{stroke:var(--shu);stroke-width:1;opacity:.35}.viz .gapzone{fill:var(--m1);opacity:.35}
.viz .lb,.viz .hm,.viz .ib{cursor:pointer}.viz .lb-hit{fill:transparent}
.viz .lb:hover .t-name,.viz .ib:hover .t-name{text-decoration:underline}
.viz .t-head{font-size:11.5px;font-weight:700}.viz .t-row{font-size:12px;font-weight:500}
.viz .t-cellnum{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;fill:#1b1f24}.viz .t-cellsub{fill:#1b1f24;opacity:.75}.viz .t-cellnum.inv,.viz .t-cellsub.inv{fill:#fff}
.viz .hm-empty{fill:none;stroke:var(--rule2)}.viz .t-dash{fill:var(--ink3);font-size:11px}
.viz .hm:hover .hm-c{stroke:var(--ink);stroke-width:1.5}
.viz .bar-rec{fill:var(--ink3);opacity:.45}.viz .limit{stroke:var(--ink);stroke-width:2}.viz .limit-over{fill:none;stroke:var(--ink);stroke-width:1.5}
.viz .land{fill:var(--wash);stroke:var(--ink3);stroke-width:.75}
:root[data-theme="dark"] .viz .t-cellnum:not(.inv),:root[data-theme="dark"] .viz .t-cellsub:not(.inv){fill:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viz .t-cellnum:not(.inv),:root:not([data-theme="light"]) .viz .t-cellsub:not(.inv){fill:#fff}
 :root:not([data-theme="light"]) .viz .t-cellnum.inv,:root:not([data-theme="light"]) .viz .t-cellsub.inv{fill:#1b1f24}}
:root[data-theme="dark"] .viz .t-cellnum.inv,:root[data-theme="dark"] .viz .t-cellsub.inv{fill:#1b1f24}
.viz-legend{display:flex;flex-wrap:wrap;gap:.2em 1.1em;font-size:11.5px;color:var(--ink2);margin-top:.5em;align-items:center;line-height:1.6}
.viz-legend i{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.35em;vertical-align:-.02em}.viz-legend i.sq{border-radius:0}.viz-legend i.rec{background:var(--ink3);opacity:.45}.viz-legend i.tick{width:2px;height:1em;background:var(--ink);border-radius:0;vertical-align:-.15em}
.lg-note{color:var(--ink3);flex-basis:100%}.viz-empty{color:var(--ink3);font-size:13px;border:1px dashed var(--rule);padding:1em}

/* 表 */
.tablewrap{overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}.tablewrap.tall{max-height:340px;overflow-y:auto}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th,.grid td{padding:.4em .6em;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
.grid thead th{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--ink);font-size:11.5px;white-space:nowrap;font-weight:700;z-index:1}
.grid .num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}.grid .ctr{text-align:center}.grid .b{font-weight:700}
.grid.reg tbody tr{cursor:pointer}.grid.reg tbody tr:hover{background:var(--wash)}
.gapmark{color:var(--shu);margin-right:.3em}
.grid.edit td{padding:.25em .3em}.grid.edit input,.grid.edit select,.grid.edit textarea{width:100%;min-width:7em;padding:.25em .4em;font-size:13px}
.grid.edit.wide td.t-num input,.grid.edit.wide td.t-money input,.grid.edit.wide td.t-pct input{min-width:5.5em}.grid.edit.wide td.t-id input{min-width:4em;width:4.5em}.grid.edit.wide td.t-text input{min-width:11em}.grid.edit.wide td.t-long textarea{min-width:20em}
.grid.edit .ql{min-width:14em;padding:.4em .6em}.idf{color:var(--ink3);background:transparent;border-color:transparent}
.imgpick{display:inline-grid;place-items:center;width:84px;height:60px;border:1px dashed var(--rule);font-size:11px;color:var(--ink3);cursor:pointer;overflow:hidden}.imgpick img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--ink);margin-bottom:10px}
.tabs button{border:0;background:transparent;padding:.4em .8em;cursor:pointer;font-size:13px;border-bottom:3px solid transparent}.tabs button.on{border-bottom-color:var(--ink);font-weight:700}.tabs small{margin-left:.3em;color:var(--ink3);font-family:var(--f-num)}
.drop{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--ink);padding:26px 16px;cursor:pointer;gap:.2em}.drop b{font-family:var(--f-head);font-size:18px}.drop span{font-size:12px;color:var(--ink3)}.drop:hover{background:var(--wash)}
.pend{border-top-color:var(--shu)}.cnt{display:flex;flex-wrap:wrap;gap:0 2em;margin:.4em 0 .8em;font-size:13px}.cnt b{font-size:24px;margin-right:.3em}
.kind{font-size:11.5px;border:1px solid var(--rule);padding:0 .4em;white-space:nowrap}.kind.k-error{border-color:var(--shu);color:var(--shu);font-weight:700}
.ok{color:var(--ink2)}.old{color:var(--ink3);text-decoration:line-through}.new{font-weight:600}

/* 詳細 */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;z-index:30}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);border-left:1px solid var(--ink);z-index:31;transform:translateX(102%);overflow-y:auto;padding:20px 22px 60px;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
.dr-head{display:flex;justify-content:space-between;gap:1em;align-items:flex-start}.dr-head h2{font-size:22px}.dr-sc{color:var(--ink2);font-size:13.5px;margin-top:.6em}
#drawer h3{font-size:14px;border-top:1px solid var(--ink);padding-top:.5em;margin:1.3em 0 .4em;font-family:var(--f-body);font-weight:700}
.lv3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:1em}
.lv3>div{padding:.5em .6em;border-right:1px solid var(--rule)}.lv3>div:last-child{border-right:0}.lv3 span{display:block;font-size:10.5px;color:var(--ink2);line-height:1.35;min-height:2.7em}.lv3 b{font-size:22px;font-weight:600}.lv3 b small{font-size:.5em;margin-left:.1em;font-family:var(--f-body)}.lv3 .on{background:var(--wash)}
table.kv{border-collapse:collapse;width:100%;font-size:13px}.kv th,.kv td{padding:.3em .5em;border-bottom:1px solid var(--rule2);text-align:left;font-weight:400}.kv thead th{font-size:11px;color:var(--ink3)}.kv th{color:var(--ink2);white-space:nowrap}.kv .num{text-align:right;font-family:var(--f-num)}.kv .ctr{text-align:center}.kv .b{font-weight:700}.kv tr.cur{background:var(--wash)}
.basis-l{margin:0;padding-left:1.2em;font-size:12.5px;line-height:1.7}.uncbox{font-size:12.5px;border:1px solid var(--shu);padding:.5em .7em}
.gapnote{color:var(--shu);font-weight:700;font-size:13px;margin-top:.6em}
.prl{list-style:none;margin:0;padding:0;font-size:13px}.prl li{border-bottom:1px solid var(--rule2);padding:.4em 0}.prl span{display:block;font-size:11.5px;color:var(--ink3)}

/* 簡易入力 */
.quick{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:0 40px;align-items:start}
.qform fieldset{border:0;border-top:2px solid var(--ink);padding:10px 0 20px;margin:0}.qform legend{font-family:var(--f-head);font-weight:700;font-size:17px;padding:0 .6em 0 0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 20px}
.qf label{display:block;font-size:13px;font-weight:500;margin-bottom:.2em}.qf input,.qf select,.qf textarea{width:100%}
.qlive{position:sticky;top:60px;border-top:2px solid var(--ink);padding-top:12px;max-height:calc(100vh - 70px);overflow-y:auto}
.ql-big{font-size:clamp(44px,5vw,68px);font-weight:600;line-height:1.1;letter-spacing:-.02em}.ql-big small{font-size:.36em;font-family:var(--f-body);margin-left:.15em;letter-spacing:0}
.ql-sub{font-size:13px;color:var(--ink2)}
.ql-ratio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:.8em 0}.ql-ratio>div{padding:.4em .5em;border-right:1px solid var(--rule)}.ql-ratio>div:last-child{border:0}.ql-ratio span{display:block;font-size:10.5px;color:var(--ink2)}.ql-ratio b{font-size:20px;font-weight:600}

  RR.num = (qid) => { const v = Number(RR.val(qid)); return isFinite(v) ? v : 0; };
  RR.setItem = function (qid, v, prov) {

  RR.newId = function (layer) {

    if (a >= 100) return nf1.format(m / 100) + '億円';

/* ---- engine.js ---- */
/* engine: 損害見積、頻度、保険、備え、集積。数値はすべてここで規則により計算する */
(function () {
  const M = (x) => RR.money(x);
  const SHINDO = ['5弱以下', '5強', '6弱', '6強', '7'];
  const num = (v) => { const n = Number(v); return v === '' || v === null || v === undefined || !isFinite(n) ? null : n; };

  /* 質問マスタの「評価への反映方法」を集める */
  function fxFor(riskId, siteId) {
    let freq = 0, sev = 1; const notes = [];
    const apply = (q, f, v, who) => {
      let d = null;
      if (f.m && v !== undefined && v !== '' && f.m[v] !== undefined) d = f.m[v];
      if (f.ge && num(v) !== null) { for (const [th, val] of f.ge) if (num(v) >= th) d = val; }
      if (d === null || d === undefined) return null;
      return { k: f.k, d, text: `${q.label}＝${v}${q.unit && q.type === 'num' ? q.unit : ''}${who ? '（' + who + '）' : ''}` };
    };
    for (const q of RR.qs) {
      if (!q.fx) continue;
      for (const f of q.fx) {
        if (f.r !== riskId) continue;
        const L = RR.layers[q.layer];
        let hits = [];
        if (L.kind === 'items') { const h = apply(q, f, RR.val(q.id)); if (h) hits.push(h); }
        else {
          let recs = RR.rows(q.layer);
          if (siteId) { if (q.layer === 'site') recs = recs.filter((r) => r.id === siteId); else if (L.siteField) recs = recs.filter((r) => r.f[L.siteField] === siteId); }
          const hs = recs.map((r) => apply(q, f, r.f[q.id], L.nameField ? r.f[L.nameField] : '')).filter(Boolean);
          if (hs.length) { hs.sort((a, b) => (f.k === 'freq' ? b.d - a.d : b.d - a.d)); hits.push(hs[0]); }
        }
        for (const h of hits) {
          if (h.k === 'freq') { if (h.d !== 0) { freq += h.d; notes.push(`${h.text}：頻度 ${h.d > 0 ? '+' : ''}${h.d}`); } }
          else if (h.d !== 1) { sev *= h.d; notes.push(`${h.text}：損害 ×${h.d}`); }
        }
      }
    }
    return { freq, sev, notes };
  }
  RR.fxDescribe = function (q) {
    if (!q.fx) return q.risks && q.risks.length ? '算式の入力値として使用' : '記録のみ';
    return q.fx.map((f) => {
      const r = RR.riskById[f.r]; const nm = r ? r.name : f.r;
      const body = f.m ? Object.keys(f.m).map((k) => `${k}→${f.k === 'freq' ? (f.m[k] > 0 ? '+' : '') + f.m[k] : '×' + f.m[k]}`).join('、') : f.ge.map(([t, v]) => `${t}以上→+${v}`).join('、');
      return `${nm}の${f.k === 'freq' ? '頻度' : '損害'}：${body}`;
    }).join('／');
  };

  function impactScore(loss, net) {
    const th = RR.c('impact_thresholds', '境界');
    if (!net || net <= 0) return { g: loss > 0 ? 5 : 1, pos: loss > 0 ? 4.5 : 0.5, ratio: null };
    const r = (loss / net) * 100; let g = 1; for (const t of th) if (r >= t) g++;
    const lo = g === 1 ? th[0] / 10 : th[g - 2], hi = g === 5 ? th[3] * 4 : th[g - 1];
    const fr = r <= 0 ? 0.08 : RR.clamp((Math.log(Math.max(r, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)), 0.08, 0.92);
    return { g, pos: g - 1 + fr, ratio: r };
  }
  RR.impactScore = impactScore;
  const freqPos = (f) => RR.clamp(f - 0.5, 0.15, 4.85);
  const freqGrade = (f) => RR.clamp(Math.round(f), 1, 5);
  RR.freqLabels = function () { const y = RR.c('freq_years', '境界'); return [`${y[0]}年に1回未満`, `${y[1]}〜${y[0]}年に1回`, `${y[2]}〜${y[1]}年に1回`, `${y[3]}〜${y[2]}年に1回`, `${y[3]}年に1回以上`]; };
  RR.impactLabels = function () { const t = RR.c('impact_thresholds', '境界'); return [`純資産の${t[0]}%未満`, `${t[0]}〜${t[1]}%`, `${t[1]}〜${t[2]}%`, `${t[2]}〜${t[3]}%`, `${t[3]}%以上`]; };

  function floodRatio(depth) {
    if (!(depth > 0)) return [0, 0, 0];
    const b = RR.c('flood_bands', '上限'); const keys = Object.keys(RR.coef.flood_ratio.rows); let i = 0; while (i < b.length && depth >= b[i]) i++;
    return RR.coef.flood_ratio.rows[keys[Math.min(i, keys.length - 1)]];
  }
  function bandName(depth) { const b = RR.c('flood_bands', '上限'); const keys = Object.keys(RR.coef.flood_ratio.rows); let i = 0; while (i < b.length && depth >= b[i]) i++; return keys[Math.min(i, keys.length - 1)]; }

  function siteCtx(s) {
    const f = s.f; const vb = num(f.site_val_bld) || 0, ve = num(f.site_val_eq) || 0, vs = num(f.site_val_stock) || 0;
    let blds = RR.rowsOfSite('building', s.id); const assume = [];
    if (!blds.length) { blds = [{ id: '-', f: { bld_name: '（建物未記入）', bld_structure: '鉄骨造（非耐火）', bld_sprinkler: 'なし', bld_compart: 'なし' }, virtual: true }]; assume.push('建物の情報が未記入のため、鉄骨造・スプリンクラーなし・区画なしと仮定'); }
    const areaSum = blds.reduce((a, b) => a + (num(b.f.bld_area) || 0), 0);
    const givenSum = blds.reduce((a, b) => a + (num(b.f.bld_share) || 0), 0);
    const shares = blds.map((b) => (givenSum > 0 ? (num(b.f.bld_share) || 0) / givenSum : areaSum > 0 ? (num(b.f.bld_area) || 0) / areaSum : 1 / blds.length));
    const hz = RR.rows('hazard').find((h) => h.f.hz_site === s.id);
    return { s, f, vb, ve, vs, V: vb + ve + vs, blds, shares, hz: hz ? hz.f : {}, hzRec: hz, assume, lines: RR.rowsOfSite('line', s.id) };
  }

  /* ---------- 算式（拠点） ---------- */
  const F = {};
  F.fire = function (c, fx) {
    const loss = [0, 0, 0], basis = [[], [], []];
    for (let L = 0; L < 3; L++) {
      let best = -1, bl = null;
      c.blds.forEach((b, i) => {
        const st = RR.hasRow('fire_base', b.f.bld_structure) ? b.f.bld_structure : '鉄骨造（非耐火）';
        const sp = RR.hasRow('fire_sprinkler', b.f.bld_sprinkler) ? b.f.bld_sprinkler : 'なし';
        const cp = RR.hasRow('fire_compart', b.f.bld_compart) ? b.f.bld_compart : 'なし';
        const base = RR.c('fire_base', st, L), ks = RR.c('fire_sprinkler', sp, L), kc = RR.c('fire_compart', cp, L);
        const sev = L < 2 ? fx.sev : 1;
        const ratio = Math.min(1, base * ks * kc * sev);
        const val = c.V * c.shares[i];

    if (t.dataset.seg) {
      const v = t.dataset.val; const k = t.dataset.seg;
      if (k === 'state') { if (v === st.mapState) return; st.prevState = st.mapState; st.mapState = v; $$('[data-seg="state"]').forEach((b) => b.classList.toggle('on', b.dataset.val === v)); const from = v === 'B' ? 'A' : v === 'C' ? 'B' : null; RR.charts.mount($('#fig1'), 'riskMap', { state: v, from, items: mapItems() }, 'move'); return; }
      if (k === 'domain') { st.domain = v; $$('[data-seg="domain"]').forEach((b) => b.classList.toggle('on', b.dataset.val === v)); drawFigs(false); return; }
      if (k === 'peril') { st.peril = v; $$('[data-seg="peril"]').forEach((b) => b.classList.toggle('on', b.dataset.val === v)); RR.charts.mount($('#fig5'), 'siteMap', { peril: v }, false); return; }
      if (k === 'layer') { st.layer = v; renderData(); return; }
      if (k === 'edition') { st.edition = v; renderReport(); return; }
      if (k === 'prompt') { st.promptKey = v; renderAI(); return; }
    }
    if (t.dataset.key && !t.dataset.act) { if (!t.dataset.key.startsWith('site:')) openRisk(t.dataset.key); return; }
    const a = t.dataset.act;
    if (a === 'close-drawer') closeDrawer();
    else if (a === 'blank') { if (confirm('いまのデータを消して、白紙の案件にします。よろしいですか。（必要なら先に「データ」画面でJSONを書き出してください）')) { const c = RR.emptyCase(); c.items.co_industry = { v: '製造', src: '', date: '', method: '未確認', note: '' }; RR.setCase(c); st.built = false; st.reportKey = ''; render(); RR.toast('白紙の案件にしました'); } }
    else if (a === 'sample') { if (confirm('いまのデータを消して、サンプル（架空）のデータに戻します。よろしいですか。')) { RR.setCase(RR.buildSample()); st.built = false; st.reportKey = ''; render(); RR.toast('サンプルのデータに戻しました'); } }
    else if (a === 'xl-full') exportXlsx('full'); else if (a === 'xl-quick') exportXlsx('quick'); else if (a === 'xl-sample') exportXlsx('full', true);
    else if (a === 'json-out') RR.download(new Blob([JSON.stringify(RR.case, null, 1)], { type: 'application/json' }), `リスク診断_案件データ_${RR.val('co_name') || '未記入'}_${RR.today()}.json`);
    else if (a === 'check') { st.pending = { kind: 'check', name: 'いまのデータ', case: RR.case, issues: RR.excel.validate(RR.case, []), diff: [] }; renderData(); $('.pend').scrollIntoView({ behavior: 'smooth' }); }
    else if (a === 'pend-cancel') { st.pending = null; renderData(); } else if (a === 'pend-apply') applyPending();
    else if (a === 'add-row') { RR.addRow(t.dataset.layer, {}, { row: { src: '', date: RR.today(), method: '未確認' } }); RR.touch(); render(); }
    else if (a === 'del-row') { const rows = RR.rows(t.dataset.layer); const i = rows.findIndex((r) => r.id === t.dataset.id); if (i >= 0 && confirm(`${t.dataset.id} を削除します。よろしいですか。`)) { rows.splice(i, 1); RR.touch(); render(); } }
    else if (a === 'add-sug') { const s = st.sug[Number(t.dataset.i)]; RR.addRow('proposal', s, { row: { src: '回答から起案', date: RR.today(), method: '資料' } }); RR.touch(); renderProposals(); RR.toast('台帳に加えました'); }
    else if (a === 'print') { (async () => { await renderReport(); $('#pages').style.zoom = 1; window.print(); fitPages(); })(); }
    else if (a === 'copy-prompt') { const ta = $('#ptext'); const done = () => RR.toast('プロンプトを写し取りました'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand('copy'); done(); }); else { ta.select(); document.execCommand('copy'); done(); } }
    else if (a === 'theme') { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(cur === 'dark' ? 'light' : 'dark'); if (st.view === 'home') drawFigs(false); }
    else if (a === 'def-save') { const ta = $(`textarea[data-def="${t.dataset.def}"]`); try { const o = JSON.parse(ta.value); if (!o.version) throw new Error('"version" がありません'); RR.saveDef(t.dataset.def, o); RR.result = null; st.reportKey = ''; renderSettings(); RR.toast(RR.DEF_LABELS[t.dataset.def] + 'を保存し、反映しました'); } catch (err) { RR.toast('JSONとして読めません：' + err.message); } }
    else if (a === 'def-reset') { if (confirm(RR.DEF_LABELS[t.dataset.def] + 'を初期値に戻します。よろしいですか。')) { RR.resetDef(t.dataset.def); RR.result = null; st.reportKey = ''; renderSettings(); RR.toast('初期値に戻しました'); } }
    else if (a === 'def-dl') RR.download(new Blob([JSON.stringify(RR.raw[t.dataset.def], null, 1)], { type: 'application/json' }), `${t.dataset.def}.json`);
    else if (a === 'demo-q') { const o = JSON.parse(JSON.stringify(RR.raw.questions)); if (o.questions.some((q) => q.id === 'bld_generator')) return RR.toast('すでに追加されています'); const i = o.questions.findIndex((q) => q.id === 'bld_exposure'); o.questions.splice(i + 1, 0, { id: 'bld_generator', layer: 'building', label: '非常用発電機', type: 'select', opts: ['あり・燃料72時間以上', 'あり', 'なし'], cope: 'P', ex: 'あり', risks: ['bi'], fx: [{ r: 'bi', k: 'sev', m: { なし: 1.1, 'あり・燃料72時間以上': 0.95 } }], help: '停電時に、消火ポンプや排水ポンプを動かせるか。' }); RR.saveDef('questions', o); RR.result = null; st.reportKey = ''; renderSettings(); RR.toast('質問を1行足しました。「データ」の建物、Excel様式、レポート第6章と付録に出ます'); }
  }
  function onChange(e) {
    const el = e.target; const d = el.dataset;
    if (el.id === 'f-site') { st.site = el.value; $('#f-all').disabled = !!st.site; drawFigs(false); }
    else if (el.id === 'f-all') { st.all = el.checked; drawFigs(false); }
    else if (el.id === 'f-level' || el.id === 's-level') { RR.case.settings.level = Number(el.value); RR.touch(); st.reportKey = ''; if (st.view === 'home') renderHome(); }
    else if (el.id === 'x-file') { if (el.files[0]) importXlsx(el.files[0]); el.value = ''; }
    else if (el.id === 'j-file') { const f = el.files[0]; if (f) f.text().then((tx) => { try { const c = JSON.parse(tx); if (!c.items || !c.rows) throw new Error('案件データの形ではありません'); RR.setCase(c); st.built = false; st.reportKey = ''; RR.toast('案件データを読み込みました'); go('home'); render(); } catch (err) { RR.toast('読み込めませんでした：' + err.message); } }); el.value = ''; }
    else if (el.id === 'r-jump') { const p = $('#pg-' + el.value); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (el.id === 'ai-mask') { RR.case.settings.mask = el.checked; RR.saveCase(); renderAI(); }
    else if (d.quick) onQuickInput(el); else if (d.quickprep) onQuickPrep(el);
    else if (d.edit === 'item') { const q = RR.qById[d.q]; RR.setItem(q.id, readInput(q, el)); if (q.id === 'co_industry') { RR.rebuild(); renderData(); } const u = el.parentNode.querySelector('.unc'); if (u && el.value !== '') u.remove(); }
    else if (d.edit === 'item-prov') { const it = RR.case.items[d.q] || (RR.case.items[d.q] = { v: '', src: '', date: '', method: '未確認', note: '' }); it[d.k] = el.value; RR.touch(); }
    else if (d.edit === 'row') { const q = RR.qById[d.q]; const r = RR.rows(d.layer).find((x) => x.id === d.id); if (!r) return; if (q.type === 'image') { const f = el.files[0]; if (f) shrink(f).then((url) => { r.f[q.id] = url; RR.touch(); render(); }); return; } const v = readInput(q, el); if (v === '') delete r.f[q.id]; else r.f[q.id] = v; RR.touch(); }
    else if (d.edit === 'row-prov') { const r = RR.rows(d.layer).find((x) => x.id === d.id); if (!r) return; r.prov = r.prov || {}; (r.prov[d.pg] = r.prov[d.pg] || { src: '', date: RR.today(), method: '未確認' })[d.k] = el.value; if (d.k === 'method' && el.value !== '未確認' && !r.prov[d.pg].date) r.prov[d.pg].date = RR.today(); RR.touch(); }
    else if (d.coef) { const o = RR.raw.coefficients; const t = o.tables.find((x) => x.id === d.coef); const v = Number(el.value); if (!isFinite(v)) return; t.rows[d.row][Number(d.col)] = v; t.revised = RR.today(); RR.saveDef('coefficients', o); RR.result = null; st.reportKey = ''; RR.toast('係数を変更しました。図とレポートに反映されます'); }
    else if (d.coefmeta) { const o = RR.raw.coefficients; o.tables.find((x) => x.id === d.coefmeta)[d.k] = el.value; RR.saveDef('coefficients', o); st.reportKey = ''; }
    else if (d.lname !== undefined || d.lshort !== undefined) { const o = RR.raw.coefficients; if (d.lname !== undefined) o.levelNames[Number(d.lname)] = el.value; else o.levelShort[Number(d.lshort)] = el.value; RR.saveDef('coefficients', o); RR.result = null; st.reportKey = ''; RR.toast('水準の呼び名を変更しました'); }
  }
  function onInput(e) { const el = e.target; if (el.dataset.quick && el.tagName !== 'SELECT') onQuickInput(el); else if (el.id === 'aiout') { RR.case.ai[st.promptKey] = el.value; st.reportKey = ''; saveSoon(); } }
  const saveSoon = debounce(() => RR.saveCase(), 500);
  function shrink(file) { return new Promise((res) => { const img = new Image(); const url = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78)); }; img.src = url; }); }

  RR.start = function () {
    RR.loadDefs(); const th = RR.LS.get('rr.theme'); if (th) document.documentElement.dataset.theme = th;
    const saved = RR.LS.get('rr.case'); RR.case = RR.emptyCase(); if (saved && saved.items && saved.rows) RR.setCase(saved, { save: false }); else RR.setCase(RR.buildSample());
    $('#nav').innerHTML = VIEWS.map(([v, l]) => `<a href="#${v}" data-v="${v}">${l}</a>`).join('');
    document.addEventListener('click', onClick); document.addEventListener('change', onChange); document.addEventListener('input', onInput);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.key && e.target.tagName !== 'BUTTON') { e.preventDefault(); openRisk(e.target.dataset.key); } });
    document.addEventListener('toggle', (e) => { const d = e.target; if (d.classList && d.classList.contains('def') && d.open) { const ta = d.querySelector('textarea'); if (!ta.value) ta.value = prettyDef(ta.dataset.def); } }, true);
    $('#scrim').addEventListener('click', closeDrawer);
    const dz = document.body; ['dragover', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return; e.preventDefault(); if (ev === 'drop') { const f = e.dataTransfer.files[0]; if (f && /\.xlsx$/i.test(f.name)) { if (st.view !== 'data') { go('data'); setTimeout(() => importXlsx(f), 60); } else importXlsx(f); } else RR.toast('.xlsx のファイルを置いてください'); } }));
    window.addEventListener('hashchange', route);
    window.addEventListener('resize', debounce(() => { if (st.view === 'home') drawFigs(false); else if (st.view === 'quick') renderQuickLive(false); else if (st.view === 'report') fitPages(); }, 200));
    window.addEventListener('beforeprint', () => { const p = $('#pages'); if (p) p.style.zoom = 1; }); window.addEventListener('afterprint', fitPages);
    route();
  };
})();

</script>

(function(){try{RR.start()}catch(e){console.error(e);document.getElementById('v-home').classList.add('on');document.getElementById('v-home').innerHTML='<p style="padding:2em">起動できませんでした：'+String(e&&e.message||e).replace(/</g,'&lt;')+'</p>'}})();
</script>
